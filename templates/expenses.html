<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/static/assets/css/style.css?v={{ range(1, 100000) | random }}">
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="admin-dashboard.html" class="sidebar-brand">
                <img src="/static/assets/img/logo.png" alt="Renvora Tech Logo" style="height: 48px; width: auto; object-fit: contain;"> <span style="margin-left: 8px; font-weight: 700;">Renvora Tech</span>
            </a>
        </div>
        <div class="sidebar-menu py-3">
            <a href="admin-dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
            <a href="employees.html" class="nav-link"><i class="fas fa-users"></i> Employees</a>
            <a href="projects.html" class="nav-link"><i class="fas fa-project-diagram"></i> Projects</a>
            <a href="clients.html" class="nav-link"><i class="fas fa-briefcase"></i> Clients</a>
            <a href="daily-work.html" class="nav-link"><i class="fas fa-clipboard-list"></i> Daily Work Report</a>
<a href="#financeSubmenu" data-bs-toggle="collapse" class="nav-link d-flex align-items-center"><i class="fas fa-wallet"></i> Finance <i class="fas fa-chevron-down ms-auto" style="font-size:0.8em"></i></a>
            <div class="collapse show" id="financeSubmenu">
                <a href="salary.html" class="nav-link " style="padding-left: 3rem; font-size: 0.95em;"><i class="fas fa-money-bill-wave"></i> Salary</a>
                <a href="expenses.html" class="nav-link active" style="padding-left: 3rem; font-size: 0.95em;"><i class="fas fa-file-invoice-dollar"></i> Expenses</a>
            </div>
                        <a href="policy.html" class="nav-link"><i class="fas fa-book"></i> Company Policy</a>
            <a href="login.html" class="nav-link text-danger mt-4"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <button class="btn btn-light rounded-circle shadow-sm" id="sidebarToggle">
                <i class="fas fa-bars text-primary"></i>
            </button>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-light rounded-circle shadow-sm" id="themeToggle" style="width: 40px; height: 40px;">
                    <i class="fas fa-moon text-primary"></i>
                </button>
                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="https://ui-avatars.com/api/?name=Admin+User&background=2563EB&color=fff" class="profile-img-sm me-2">
                        <span class="d-none d-md-inline fw-semibold" style="color: var(--text-color);">Admin User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0" aria-labelledby="profileDropdown">
                        <li><a class="dropdown-item" href="#"><i class="fas fa-user me-2"></i>Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="login.html"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </header>

        <div class="container-fluid p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">Expenses</h4>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addExpenseModal"><i class="fas fa-plus me-2"></i>Add Expense</button>
            </div>
            
            <div class="row g-4 mb-4">
                <div class="col-12"><div class="glass-card p-4 text-center border-start border-4 border-primary"><h3 class="fw-bold text-primary mb-1" id="statExpenseTotal">₹0</h3><p class="text-muted mb-0 fw-semibold">Total Expenses</p></div></div>
            </div>

            <div class="glass-card p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Expense Name</th>
                                <th>Amount</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="expenseTableBody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Add Expense Modal -->
    <div class="modal fade" id="addExpenseModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content glass-card border-0">
          <div class="modal-header border-bottom border-secondary">
            <h5 class="modal-title fw-bold">Add New Expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="addExpenseForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Expense Name</label>
                    <input type="text" class="form-control" id="expName" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Amount (₹)</label>
                    <input type="number" class="form-control" id="expAmount" min="0" step="0.01" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Date</label>
                    <input type="date" class="form-control" id="expDate" required>
                </div>
                <div class="text-end mt-4">
                    <button type="button" class="btn btn-light me-2" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Expense</button>
                </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/assets/js/script.js?v=4"></script>
</body>
</html>
