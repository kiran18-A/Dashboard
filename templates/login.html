<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Management Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/assets/css/style.css?v={{ range(1, 100000) | random }}">
</head>
<body class="login-page">
    
    <!-- Theme Toggle (absolute top right) -->
    <button class="btn btn-light position-absolute top-0 end-0 m-4 rounded-circle shadow" id="themeToggle" style="width: 45px; height: 45px;">
        <i class="fas fa-moon text-primary"></i>
    </button>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="d-flex align-items-center justify-content-center mb-2">
                <img src="/static/assets/img/logo.png" alt="Renvora Tech Logo" style="height: 48px; width: auto; object-fit: contain;">
                <h3 class="text-primary fw-bold mb-0 ms-2">Renvora Tech</h3>
            </div>
            <p class="text-muted">Employee Management System</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" class="form-control border-start-0" id="username" placeholder="Enter 'admin' or 'employee'" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" placeholder="••••••••" required>
                </div>
            </div>
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember Me</label>
                </div>
                <a href="#" class="text-decoration-none small text-primary" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-semibold shadow-sm">
                Login <i class="fas fa-sign-in-alt ms-2"></i>
            </button>
        </form>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Script -->
    <script src="/static/assets/js/script.js?v={{ range(1, 100000) | random }}"></script>

        <!-- Change Password Modal -->
        <div class="modal fade" id="changePasswordModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content glass-card border-0 shadow-lg">
                    <div class="modal-header border-0 pb-0 pt-4 px-4">
                        <h5 class="modal-title fw-bold d-flex align-items-center gap-2 text-primary">
                            <i class="fas fa-key"></i> Change Password
                        </h5>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="changePasswordForm">
                        <div class="modal-body p-4">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Current Password</label>
                                <input type="password" class="form-control" id="cpCurrent" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">New Password</label>
                                <input type="password" class="form-control" id="cpNew" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Confirm New Password</label>
                                <input type="password" class="form-control" id="cpConfirm" required>
                            </div>
                        </div>
                        <div class="modal-footer border-0 bg-transparent px-4 pb-4">
                            <button type="button" class="btn btn-secondary px-4 rounded-pill" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary px-4 rounded-pill">Update Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Forgot Password Modal -->
        <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content glass-card border-0 shadow-lg">
                    <div class="modal-header border-0 pb-0 pt-4 px-4">
                        <h5 class="modal-title fw-bold d-flex align-items-center gap-2 text-primary">
                            <i class="fas fa-envelope"></i> Reset Password
                        </h5>
                        <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="forgotPasswordForm">
                        <div class="modal-body p-4">
                            <p class="text-muted small mb-4">Enter your username or email address and we'll send you a link to reset your password.</p>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username or Email</label>
                                <input type="text" class="form-control" id="fpIdentifier" required placeholder="admin@itcorp.com">
                            </div>
                        </div>
                        <div class="modal-footer border-0 bg-transparent px-4 pb-4">
                            <button type="button" class="btn btn-secondary px-4 rounded-pill" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary px-4 rounded-pill">
                                <span id="fpBtnText">Send Reset Link</span>
                                <span id="fpBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

</body>
</html>
