<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Employee Management Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/assets/css/style.css?v={{ range(1, 100000) | random }}">
</head>
<body class="login-page">
    
    <!-- Theme Toggle (absolute top right) -->
    <button class="btn btn-light position-absolute top-0 end-0 m-4 rounded-circle shadow" id="themeToggle" style="width: 45px; height: 45px;">
        <i class="fas fa-moon text-primary"></i>
    </button>

    <div class="login-card">
        <div class="text-center mb-4">
            <h3 class="text-primary fw-bold"><i class="fas fa-building me-2"></i>IT Corp</h3>
            <p class="text-muted">Employee Management System</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" class="form-control border-start-0" id="username" placeholder="Enter 'admin' or 'employee'" required>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-end-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" placeholder="••••••••" required>
                </div>
            </div>
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember Me</label>
                </div>
                <a href="#" class="text-decoration-none small text-primary">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-semibold shadow-sm">
                Login <i class="fas fa-sign-in-alt ms-2"></i>
            </button>
        </form>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Script -->
    <script src="/static/assets/js/script.js?v={{ range(1, 100000) | random }}"></script>
</body>
</html>
