<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/static/assets/css/style.css">
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="admin-dashboard.html" class="sidebar-brand">
                <img src="/static/assets/img/logo.png" alt="Renvora Tech Logo" style="height: 48px; width: auto; object-fit: contain;"> <span style="margin-left: 8px; font-weight: 700;">Renvora Tech</span>
            </a>
        </div>
        <div class="sidebar-menu py-3">
            <a href="admin-dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
            <a href="employees.html" class="nav-link"><i class="fas fa-users"></i> Employees</a>
            <a href="projects.html" class="nav-link"><i class="fas fa-project-diagram"></i> Projects</a>
            <a href="clients.html" class="nav-link"><i class="fas fa-briefcase"></i> Clients</a>
            <a href="daily-work.html" class="nav-link"><i class="fas fa-clipboard-list"></i> Daily Work Report</a>
            <a href="policy.html" class="nav-link"><i class="fas fa-book"></i> Company Policy</a>
            <a href="#financeSubmenu" data-bs-toggle="collapse" class="nav-link d-flex align-items-center"><i class="fas fa-wallet"></i> Finance <i class="fas fa-chevron-down ms-auto" style="font-size:0.8em"></i></a>
            <div class="collapse show" id="financeSubmenu">
                <a href="salary.html" class="nav-link active" style="padding-left: 3rem; font-size: 0.95em;"><i class="fas fa-money-bill-wave"></i> Salary</a>
                <a href="expenses.html" class="nav-link " style="padding-left: 3rem; font-size: 0.95em;"><i class="fas fa-file-invoice-dollar"></i> Expenses</a>
            </div>
            <a href="login.html" class="nav-link text-danger mt-4"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <button class="btn btn-light rounded-circle shadow-sm" id="sidebarToggle">
                <i class="fas fa-bars text-primary"></i>
            </button>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-light rounded-circle shadow-sm" id="themeToggle" style="width: 40px; height: 40px;">
                    <i class="fas fa-moon text-primary"></i>
                </button>
                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="https://ui-avatars.com/api/?name=Admin+User&background=2563EB&color=fff" class="profile-img-sm me-2">
                        <span class="d-none d-md-inline fw-semibold" style="color: var(--text-color);">Admin User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0" aria-labelledby="profileDropdown">
                        <li><a class="dropdown-item" href="#"><i class="fas fa-user me-2"></i>Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="login.html"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </header>

        <div class="container-fluid p-4">
            <h4 class="mb-4 fw-bold">Salary Management</h4>
            
            <div class="row g-4 mb-4">
                <div class="col-12 col-md-4"><div class="glass-card p-4 border-start border-4 border-success"><h3 class="fw-bold text-success mb-1" id="statSalaryPaid">₹0</h3><p class="text-muted mb-0 fw-semibold">Salary Paid</p></div></div>
                <div class="col-12 col-md-4"><div class="glass-card p-4 border-start border-4 border-warning"><h3 class="fw-bold text-warning mb-1" id="statSalaryPending">₹0</h3><p class="text-muted mb-0 fw-semibold">Pending Salary</p></div></div>
                <div class="col-12 col-md-4"><div class="glass-card p-4 border-start border-4 border-primary"><h3 class="fw-bold text-primary mb-1" id="statSalaryTotal">₹0</h3><p class="text-muted mb-0 fw-semibold">Total Salary</p></div></div>
            </div>

            <div class="glass-card p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Employee</th>
                                <th>Month</th>
                                <th>Salary</th>
                                <th>Status</th>
                                <th>Paid Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="salaryTableBody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/assets/js/script.js"></script>
</body>
</html>
