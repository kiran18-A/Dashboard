<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quotation - Renvora Tech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="/static/assets/css/style.css" rel="stylesheet">
    <style>
        .quotation-card { background: rgba(255, 255, 255, 0.95); border-radius: 1rem; border: 1px solid rgba(255, 255, 255, 0.2); }
        .section-title { font-size: 1.1rem; font-weight: 600; color: #1e3a8a; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; margin-bottom: 1rem; }
    </style>
</head>
<body class="bg-light">

    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg top-nav px-4 py-3 border-bottom shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center fw-bold fs-4 text-white" href="#">
                <i class="fas fa-layer-group me-2"></i> Renvora Tech
            </a>
            <div class="d-flex align-items-center">
                <div class="dropdown">
                    <a class="nav-link dropdown-toggle text-white d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown">
                        <img src="https://ui-avatars.com/api/?name=User&background=random" class="rounded-circle me-2" width="32" height="32" id="userAvatar">
                        <span id="userNameDisplay">User</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Sidebar and Content -->
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="sidebar glass-card m-3 border-0">
            <div class="sidebar-menu py-3">
                <!-- Loaded dynamically based on role -->
            </div>
        </nav>

        <!-- Main Content -->
        <div class="main-content flex-grow-1 p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">Create New Quotation</h4>
                <a href="quotation.html" class="btn btn-outline-secondary shadow-sm"><i class="fas fa-arrow-left me-2"></i>Back</a>
            </div>

            <div class="quotation-card shadow-sm p-4">
                <form id="createQuotationForm">
                    
                    <div class="row mb-4">
                        <div class="col-md-4">
                            <label class="form-label text-muted small fw-semibold">Quotation No.</label>
                            <input type="text" class="form-control" id="quoteNo" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted small fw-semibold">Date</label>
                            <input type="date" class="form-control" id="quoteDate" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted small fw-semibold">Due Date</label>
                            <input type="date" class="form-control" id="quoteDueDate" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <div class="section-title">Company/Seller Info</div>
                            <div class="mb-2"><input type="text" class="form-control" id="sellerName" placeholder="Name" value="Renvora Tech" required></div>
                            <div class="mb-2"><textarea class="form-control" id="sellerAddress" placeholder="Address" rows="2">Renvora Tech Private Limited
IT Park, Cyber City</textarea></div>
                            <div class="row">
                                <div class="col-6 mb-2"><input type="text" class="form-control" id="sellerPhone" placeholder="Phone No." value="+91-9876543210"></div>
                                <div class="col-6 mb-2"><input type="email" class="form-control" id="sellerEmail" placeholder="Email ID" value="info@renvoratech.com"></div>
                                
                                <div class="col-6 mb-2"><input type="text" class="form-control" id="sellerState" placeholder="State" value="Maharashtra"></div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="section-title">Quote / Shipping To</div>
                            <div class="mb-2"><input type="text" class="form-control" id="buyerName" placeholder="Name" list="clientsList" autocomplete="off" required>
                            <datalist id="clientsList"></datalist></div>
                            <div class="mb-2"><textarea class="form-control" id="buyerAddress" placeholder="Address" rows="2"></textarea></div>
                            <div class="row">
                                <div class="col-6 mb-2"><input type="text" class="form-control" id="buyerPhone" placeholder="Contact No."></div>
                                <div class="col-6 mb-2"><input type="text" class="form-control" id="buyerEmail" placeholder="Email ID"></div>
                                
                                <div class="col-6 mb-2"><input type="text" class="form-control" id="buyerState" placeholder="State"></div>
                            </div>
                        </div>
                    </div>

                    <div class="section-title">Items</div>
                    <div class="table-responsive mb-3">
                        <table class="table table-bordered align-middle" id="itemsTable">
                            <thead class="table-light">
                                <tr>
                                    <th>Service Name</th>
                                    <th width="10%">Quantity</th>
                                    <th width="10%">Unit</th>
                                    <th width="15%">Price/Unit</th>
                                    <th width="10%">Discount</th>
                                    <th width="10%">GST %</th>
                                    <th width="15%">Amount</th>
                                    <th width="5%"></th>
                                </tr>
                            </thead>
                            <tbody id="itemsBody">
                                <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                        <button type="button" class="btn btn-sm btn-outline-primary" id="addRowBtn"><i class="fas fa-plus me-1"></i> Add Row</button>
                    </div>

                    <div class="row mt-4">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-semibold">Amount in words:</label>
                                <textarea class="form-control" id="amountWords" rows="2"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-semibold">Terms & Conditions:</label>
                                <textarea class="form-control" id="terms" rows="4"></textarea>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <table class="table table-borderless">
                                <tr><td class="text-end fw-semibold">Sub Total:</td><td width="30%"><input type="number" class="form-control form-control-sm text-end" id="subTotal" readonly></td></tr>
                                <tr><td class="text-end fw-semibold">Discount:</td><td><input type="number" class="form-control form-control-sm text-end" id="totalDiscount" readonly></td></tr>
                                <tr><td class="text-end fw-semibold">SGST:</td><td><input type="number" class="form-control form-control-sm text-end" id="sgst" readonly></td></tr>
                                <tr><td class="text-end fw-semibold">CGST:</td><td><input type="number" class="form-control form-control-sm text-end" id="cgst" readonly></td></tr>
                                <tr class="table-primary"><td class="text-end fw-bold">Total Invoice Amount:</td><td><input type="number" class="form-control form-control-sm text-end fw-bold" id="totalAmount" readonly></td></tr>
                                <tr><td class="text-end fw-semibold">Service Charge:</td><td><input type="number" class="form-control form-control-sm text-end" id="serviceCharge" value="0"></td></tr>
                                <tr class="table-info"><td class="text-end fw-bold">Grand Total Amount:</td><td><input type="number" class="form-control form-control-sm text-end fw-bold" id="grandTotal" readonly></td></tr>
                                <tr><td class="text-end fw-semibold">Received:</td><td><input type="number" class="form-control form-control-sm text-end" id="receivedAmt" value="0"></td></tr>
                                <tr><td class="text-end fw-semibold">Balance:</td><td><input type="number" class="form-control form-control-sm text-end" id="balanceAmt" readonly></td></tr>
                            </table>
                        </div>
                    </div>

                    <div class="text-end mt-4 border-top pt-3">
                        <button type="submit" class="btn btn-primary px-4 shadow-sm" id="saveQuoteBtn">Save Quotation</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Global Calendar Modal -->
    <div class="modal fade" id="globalCalendarModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content glass-card border-0">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold">Calendar</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="globalCalendar"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/assets/js/context.js"></script>
    <script>
        document.addEventListener('contextLoaded', (e) => {
            const data = e.detail;
            const role = data.role;
            const designation = (data.designation || '').toLowerCase();
            const sidebarMenu = document.querySelector('.sidebar-menu');
            
            let menuHtml = '';
            
            if (role === 'admin') {
                menuHtml = `
                    <a href="admin-dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
                    <a href="employees.html" class="nav-link"><i class="fas fa-users"></i> Employees</a>
                    <a href="attendance.html" class="nav-link"><i class="fas fa-clock"></i> Attendance</a>
                    <a href="clients.html" class="nav-link"><i class="fas fa-briefcase"></i> Clients</a>
                    <a href="projects.html" class="nav-link"><i class="fas fa-project-diagram"></i> Projects</a>
                    <a href="daily-work.html" class="nav-link"><i class="fas fa-clipboard-list"></i> Daily Work Report</a>
                    <a href="#financeSubmenu" data-bs-toggle="collapse" class="nav-link d-flex align-items-center"><i class="fas fa-wallet"></i> Finance <i class="fas fa-chevron-down ms-auto" style="font-size:0.8em"></i></a>
                    <div class="collapse show" id="financeSubmenu">
                        <a href="salary.html" class="nav-link" style="padding-left: 3rem; font-size: 0.95em;"><i class="fas fa-money-bill-wave"></i> Salary</a>
                        <a href="expenses.html" class="nav-link" style="padding-left: 3rem; font-size: 0.95em;"><i class="fas fa-file-invoice-dollar"></i> Expenses</a>
                        <a href="incomes.html" class="nav-link" style="padding-left: 3rem; font-size: 0.95em;"><i class="fas fa-coins"></i> Income</a>
                    </div>
                    <a href="invoice.html" class="nav-link"><i class="fas fa-file-invoice"></i> Invoices</a>
                    <a href="quotation.html" class="nav-link active"><i class="fas fa-file-signature"></i> Quotations</a>
                    <a href="policy.html" class="nav-link"><i class="fas fa-book"></i> Company Policy</a>
                    <a href="#" class="nav-link" data-bs-toggle="modal" data-bs-target="#changePasswordModal"><i class="fas fa-key"></i> Change Password</a>
                    <a href="login.html" class="nav-link text-danger mt-4"><i class="fas fa-sign-out-alt"></i> Logout</a>
                `;
            } else if ((designation || '').toLowerCase() === 'hr') {
                menuHtml = `
                    <a href="hr-dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
                    <a href="hr-employees.html" class="nav-link"><i class="fas fa-users"></i> Employees</a>
                    <a href="hr-attendance.html" class="nav-link"><i class="fas fa-clock"></i> Attendance</a>
                    <a href="hr-salary.html" class="nav-link"><i class="fas fa-money-bill-wave"></i> Payroll</a>
                    <a href="invoice.html" class="nav-link"><i class="fas fa-file-invoice"></i> Invoices</a>
                    <a href="quotation.html" class="nav-link active"><i class="fas fa-file-signature"></i> Quotations</a>
                    <a href="policy.html" class="nav-link"><i class="fas fa-book"></i> Company Policy</a>
                    <a href="#" class="nav-link" data-bs-toggle="modal" data-bs-target="#changePasswordModal"><i class="fas fa-key"></i> Change Password</a>
                    <a href="login.html" class="nav-link text-danger mt-4"><i class="fas fa-sign-out-alt"></i> Logout</a>
                `;
            } else if ((designation || '').toLowerCase() === 'manager') {
                menuHtml = `
                    <a href="manager-dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
                    <a href="manager-attendance.html" class="nav-link"><i class="fas fa-clock"></i> My Attendance</a>
                    <a href="manager-daily-work.html" class="nav-link"><i class="fas fa-clipboard-list"></i> Daily Work Report</a>
                    <a href="manager-projects.html" class="nav-link"><i class="fas fa-project-diagram"></i> Assigned Projects</a>
                    <a href="invoice.html" class="nav-link"><i class="fas fa-file-invoice"></i> Invoices</a>
                    <a href="quotation.html" class="nav-link active"><i class="fas fa-file-signature"></i> Quotations</a>
                    <a href="policy.html" class="nav-link"><i class="fas fa-book"></i> Company Policy</a>
                    <a href="#" class="nav-link" data-bs-toggle="modal" data-bs-target="#changePasswordModal"><i class="fas fa-key"></i> Change Password</a>
                    <a href="login.html" class="nav-link text-danger mt-4"><i class="fas fa-sign-out-alt"></i> Logout</a>
                `;
            } else {
                menuHtml = `
                    <a href="employee-dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
                    <a href="daily-work.html" class="nav-link"><i class="fas fa-clipboard-list"></i> Daily Work Report</a>
                    <a href="invoice.html" class="nav-link"><i class="fas fa-file-invoice"></i> Invoices</a>
                    <a href="quotation.html" class="nav-link active"><i class="fas fa-file-signature"></i> Quotations</a>
                    <a href="policy.html" class="nav-link"><i class="fas fa-book"></i> Company Policy</a>
                    <a href="#" class="nav-link" data-bs-toggle="modal" data-bs-target="#changePasswordModal"><i class="fas fa-key"></i> Change Password</a>
                    <a href="login.html" class="nav-link text-danger mt-4"><i class="fas fa-sign-out-alt"></i> Logout</a>
                `;
            }
            
            sidebarMenu.innerHTML = menuHtml;
        });

        // Quotation Generator Logic
        const itemsBody = document.getElementById('itemsBody');
        const addRowBtn = document.getElementById('addRowBtn');
        
        function calculateRow(tr) {
            const qty = parseFloat(tr.querySelector('.q-qty').value) || 0;
            const price = parseFloat(tr.querySelector('.q-price').value) || 0;
            const disc = parseFloat(tr.querySelector('.q-disc').value) || 0;
            const gst = parseFloat(tr.querySelector('.q-gst').value) || 0;
            
            const base = qty * price;
            const afterDisc = base - disc;
            const gstAmt = afterDisc * (gst / 100);
            const total = afterDisc + gstAmt;
            
            tr.querySelector('.q-amount').value = total.toFixed(2);
            calculateTotals();
        }

        function calculateTotals() {
            let subTotal = 0;
            let totalDisc = 0;
            let totalGST = 0;
            
            document.querySelectorAll('#itemsBody tr').forEach(tr => {
                const qty = parseFloat(tr.querySelector('.q-qty').value) || 0;
                const price = parseFloat(tr.querySelector('.q-price').value) || 0;
                const disc = parseFloat(tr.querySelector('.q-disc').value) || 0;
                const gst = parseFloat(tr.querySelector('.q-gst').value) || 0;
                
                const base = qty * price;
                const afterDisc = base - disc;
                const gstAmt = afterDisc * (gst / 100);
                
                subTotal += base;
                totalDisc += disc;
                totalGST += gstAmt;
            });
            
            document.getElementById('subTotal').value = subTotal.toFixed(2);
            document.getElementById('totalDiscount').value = totalDisc.toFixed(2);
            document.getElementById('sgst').value = (totalGST / 2).toFixed(2);
            document.getElementById('cgst').value = (totalGST / 2).toFixed(2);
            
            const totalInv = subTotal - totalDisc + totalGST;
            document.getElementById('totalAmount').value = totalInv.toFixed(2);
            
            const serviceCharge = parseFloat(document.getElementById('serviceCharge').value) || 0;
            const grandTotal = totalInv + serviceCharge;
            document.getElementById('grandTotal').value = grandTotal.toFixed(2);
            
            const received = parseFloat(document.getElementById('receivedAmt').value) || 0;
            document.getElementById('balanceAmt').value = (grandTotal - received).toFixed(2);
        }

        function addRow() {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="form-control form-control-sm q-name" required></td>
                <td><input type="number" class="form-control form-control-sm q-qty" value="1" min="1"></td>
                <td><input type="text" class="form-control form-control-sm q-unit"></td>
                <td><input type="number" class="form-control form-control-sm q-price" value="0"></td>
                <td><input type="number" class="form-control form-control-sm q-disc" value="0"></td>
                <td><input type="number" class="form-control form-control-sm q-gst" value="0"></td>
                <td><input type="number" class="form-control form-control-sm q-amount" readonly></td>
                <td><button type="button" class="btn btn-sm btn-light text-danger rm-row"><i class="fas fa-times"></i></button></td>
            `;
            itemsBody.appendChild(tr);
            
            tr.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('input', () => calculateRow(tr));
            });
            
            tr.querySelector('.rm-row').addEventListener('click', () => {
                tr.remove();
                calculateTotals();
            });
            calculateTotals();
        }

        addRowBtn.addEventListener('click', addRow);
        
        ['serviceCharge', 'receivedAmt'].forEach(id => {
            document.getElementById(id).addEventListener('input', calculateTotals);
        });

        // Initialize with one row
        addRow();
        document.getElementById('quoteDate').valueAsDate = new Date();

        // Default quotation number based on existing count
        const qNoInput = document.getElementById('quoteNo');
        if(qNoInput && !qNoInput.value) {
            fetch('/api/quotations')
                .then(res => res.json())
                .then(data => {
                    const count = data.length + 1;
                    const padded = String(count).padStart(3, '0');
                    qNoInput.value = `RVQ${padded}`;
                })
                .catch(err => {
                    console.error('Error fetching quotations for ID generation', err);
                    qNoInput.value = `RVQ001`; // fallback
                });
        }

        // Fetch clients for autocomplete
        fetch('/api/clients')
            .then(res => res.json())
            .then(data => {
                if (data.clients) {
                    const datalist = document.getElementById('clientsList');
                    window.clientDataMap = {};
                    data.clients.forEach(client => {
                        const opt = document.createElement('option');
                        opt.value = client.name || client.company;
                        datalist.appendChild(opt);
                        window.clientDataMap[opt.value] = client;
                    });
                }
            })
            .catch(err => console.error('Error fetching clients', err));
            
        // Auto-fill client details when selected
        document.getElementById('buyerName').addEventListener('input', (e) => {
            const selectedName = e.target.value;
            if (window.clientDataMap && window.clientDataMap[selectedName]) {
                const client = window.clientDataMap[selectedName];
                
                if (client.phone && document.getElementById('buyerPhone')) document.getElementById('buyerPhone').value = client.phone;
                if (client.email && document.getElementById('buyerEmail')) document.getElementById('buyerEmail').value = client.email;
                if (client.address && document.getElementById('buyerAddress')) document.getElementById('buyerAddress').value = client.address;
            }
        });


        document.getElementById('createQuotationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const items = [];
            document.querySelectorAll('#itemsBody tr').forEach(tr => {
                items.push({
                    name: tr.querySelector('.q-name').value,
                    qty: parseFloat(tr.querySelector('.q-qty').value) || 0,
                    unit: tr.querySelector('.q-unit').value,
                    price: parseFloat(tr.querySelector('.q-price').value) || 0,
                    disc: parseFloat(tr.querySelector('.q-disc').value) || 0,
                    gst: parseFloat(tr.querySelector('.q-gst').value) || 0,
                    amount: parseFloat(tr.querySelector('.q-amount').value) || 0
                });
            });

            const data = {
                quote_no: document.getElementById('quoteNo').value,
                date: document.getElementById('quoteDate').value,
                due_date: document.getElementById('quoteDueDate').value,
                seller_info: {
                    name: document.getElementById('sellerName').value,
                    address: document.getElementById('sellerAddress').value,
                    phone: document.getElementById('sellerPhone').value,
                    email: document.getElementById('sellerEmail').value,
                    state: document.getElementById('sellerState').value
                },
                buyer_info: {
                    name: document.getElementById('buyerName').value,
                    address: document.getElementById('buyerAddress').value,
                    phone: document.getElementById('buyerPhone').value,
                    email: document.getElementById('buyerEmail').value,
                    state: document.getElementById('buyerState').value
                },
                items: items,
                totals: {
                    sub_total: parseFloat(document.getElementById('subTotal').value),
                    discount: parseFloat(document.getElementById('totalDiscount').value),
                    sgst: parseFloat(document.getElementById('sgst').value),
                    cgst: parseFloat(document.getElementById('cgst').value),
                    total_invoice: parseFloat(document.getElementById('totalAmount').value),
                    service_charge: parseFloat(document.getElementById('serviceCharge').value),
                    total_amount: parseFloat(document.getElementById('grandTotal').value),
                    received: parseFloat(document.getElementById('receivedAmt').value),
                    balance: parseFloat(document.getElementById('balanceAmt').value)
                },
                amount_in_words: document.getElementById('amountWords').value,
                terms: document.getElementById('terms').value,
                status: 'Sent'
            };

            const btn = document.getElementById('saveQuoteBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/quotations', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    window.location.href = 'quotation.html';
                } else {
                    alert('Failed to save quotation');
                    btn.innerHTML = 'Save Quotation';
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                btn.innerHTML = 'Save Quotation';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
