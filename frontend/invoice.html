<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="/static/assets/css/style.css?v=1787313557">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
</head>
<body>

    <!-- Change Password Modal -->
    <div class="modal fade" id="changePasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0 shadow-lg">
                <div class="modal-header border-0 pb-0 pt-4 px-4">
                    <h5 class="modal-title fw-bold d-flex align-items-center gap-2 text-primary">
                        <i class="fas fa-key"></i> Change Password
                    </h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="changePasswordForm">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Current Password</label>
                            <input type="password" class="form-control" id="cpCurrent" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">New Password</label>
                            <input type="password" class="form-control" id="cpNew" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Confirm New Password</label>
                            <input type="password" class="form-control" id="cpConfirm" required>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-0 pb-4 px-4">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4" id="cpBtn">
                            <span id="cpBtnText">Save Changes</span>
                            <div class="spinner-border spinner-border-sm d-none" id="cpBtnSpinner" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="admin-dashboard.html" class="sidebar-brand">
                <img src="/static/assets/img/logo.png" alt="Renvora Tech Logo" style="height: 48px; width: auto; object-fit: contain;" class="org-logo-display"> <span style="margin-left: 8px; font-weight: 700;"><span class="org-name-display">Renvora Tech</span></span>
            </a>
        </div>
        <div class="sidebar-menu py-3">
            <!-- Loaded dynamically based on role -->
        </div>
    </nav>

    <main class="main-content">
        <header class="top-header">
            <button class="btn btn-light rounded-circle shadow-sm" id="sidebarToggle">
                <i class="fas fa-bars text-primary"></i>
            </button>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-light rounded-circle shadow-sm" id="calendarToggle" data-bs-toggle="modal" data-bs-target="#globalCalendarModal" style="width: 40px; height: 40px;" title="View Calendar">
                    <i class="fas fa-calendar-alt text-primary"></i>
                </button>
                <button class="btn btn-light rounded-circle shadow-sm" id="themeToggle" style="width: 40px; height: 40px;">
                    <i class="fas fa-moon text-primary"></i>
                </button>
                <div class="dropdown">
                    <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle text-dark" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <img src="/static/assets/img/logo.png" class="profile-img-sm me-2" class="org-logo-display">
                        <span class="d-none d-md-inline fw-semibold" style="color: var(--text-color);">Admin User</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0" aria-labelledby="profileDropdown">
                        <li><a class="dropdown-item" href="#"><i class="fas fa-user me-2"></i>Profile</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="login.html"><i class="fas fa-sign-out-alt me-2"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </header>

        <div class="container-fluid p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">Invoices</h4>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addInvoiceModal"><i class="fas fa-plus me-2"></i>Add Invoice</button>
            </div>
            
            
            </div>

            <div class="glass-card p-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Invoice #</th>
                                <th>Client Name</th>
                                <th>Amount (₹)</th>
                                <th>Due Date</th>
                                <th>Status</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody id="invoicesTableBody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Add Invoice Modal -->
    <div class="modal fade" id="addInvoiceModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0 shadow-lg">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold text-primary"><i class="fas fa-plus me-2"></i>Add New Invoice</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 text-dark" style="background-color: white; border-radius: 0 0 1rem 1rem;">
                    <form id="addInvoiceForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Invoice Number</label>
                            <input type="text" class="form-control" id="invNum" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Client Name</label>
                            <input type="text" class="form-control" id="invClient" list="invoiceClientsList" autocomplete="off" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Description</label>
                            <input type="text" class="form-control" id="invDesc" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label text-muted small fw-semibold">Amount (₹)</label>
                                <input type="number" class="form-control" id="invAmount" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted small fw-semibold">Status</label>
                                <select class="form-select" id="invStatus" required>
                                    <option value="Pending">Pending</option>
                                    <option value="Paid">Paid</option>
                                    <option value="Overdue">Overdue</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label text-muted small fw-semibold">Issue Date</label>
                                <input type="date" class="form-control" id="invDate" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted small fw-semibold">Due Date</label>
                                <input type="date" class="form-control" id="invDueDate" required>
                            </div>
                        </div>
                        <div class="text-end mt-4">
                            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="addInvBtn">Save Invoice</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Invoice Modal -->
    <div class="modal fade" id="editInvoiceModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0 shadow-lg">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold text-primary"><i class="fas fa-edit me-2"></i>Edit Invoice</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 text-dark" style="background-color: white; border-radius: 0 0 1rem 1rem;">
                    <form id="editInvoiceForm">
                        <input type="hidden" id="editInvId">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Invoice Number</label>
                            <input type="text" class="form-control" id="editInvNum" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Client Name</label>
                            <input type="text" class="form-control" id="editInvClient" list="invoiceClientsList" autocomplete="off" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Description</label>
                            <input type="text" class="form-control" id="editInvDesc" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label text-muted small fw-semibold">Amount (₹)</label>
                                <input type="number" class="form-control" id="editInvAmount" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted small fw-semibold">Status</label>
                                <select class="form-select" id="editInvStatus" required>
                                    <option value="Pending">Pending</option>
                                    <option value="Paid">Paid</option>
                                    <option value="Overdue">Overdue</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label text-muted small fw-semibold">Issue Date</label>
                                <input type="date" class="form-control" id="editInvDate" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted small fw-semibold">Due Date</label>
                                <input type="date" class="form-control" id="editInvDueDate" required>
                            </div>
                        </div>
                        <div class="text-end mt-4">
                            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="editInvBtn">Update Invoice</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Global Calendar Modal -->
    <div class="modal fade" id="globalCalendarModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content glass-card border-0 shadow-lg">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold text-primary"><i class="fas fa-calendar-alt me-2"></i>Company Calendar</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 text-dark" style="background-color: white; border-radius: 0 0 1rem 1rem;">
                    <div id="globalCalendar"></div>
                </div>
            </div>
        </div>
    </div>


    <!-- Edit Day Modal -->
    <div class="modal fade" id="editDayModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0 shadow-lg">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold text-primary"><i class="fas fa-edit me-2"></i>Edit Day Status</h5>
                    <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 text-dark" style="background-color: white; border-radius: 0 0 1rem 1rem;">
                    <form id="editDayForm">
                        <input type="hidden" id="editDayDate">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Selected Date</label>
                            <input type="text" class="form-control" id="editDayDateDisplay" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-semibold">Status</label>
                            <select class="form-select" id="editDayType">
                                <option value="Holiday">Holiday</option>
                                <option value="Working Day">Working Day</option>
                                <option value="Default">Reset to Default</option>
                            </select>
                        </div>
                        <div class="mb-3" id="editDayNameContainer">
                            <label class="form-label text-muted small fw-semibold">Name / Occasion</label>
                            <input type="text" class="form-control" id="editDayName" placeholder="e.g. Diwali">
                        </div>
                        <div class="text-end mt-4">
                            <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/assets/js/context.js"></script>
    <script src="/static/assets/js/script.js"></script>
    
    <script>
        document.addEventListener('contextLoaded', (e) => {
            const data = e.detail;
            const role = data.role;
            const designation = (data.designation || '').toLowerCase();
            const sidebarMenu = document.querySelector('.sidebar-menu');
            
            let menuHtml = '';
            
            if (role === 'admin') {
                menuHtml = `
                    <a href="admin-dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
                    <a href="employees.html" class="nav-link"><i class="fas fa-users"></i> Employees</a>
                    <a href="attendance.html" class="nav-link"><i class="fas fa-clock"></i> Attendance</a>
                    <a href="clients.html" class="nav-link"><i class="fas fa-briefcase"></i> Clients</a>
                    <a href="projects.html" class="nav-link"><i class="fas fa-project-diagram"></i> Projects</a>
                    <a href="daily-work.html" class="nav-link"><i class="fas fa-clipboard-list"></i> Daily Work Report</a>
                    <a href="#financeSubmenu" data-bs-toggle="collapse" class="nav-link d-flex align-items-center"><i class="fas fa-wallet"></i> Finance <i class="fas fa-chevron-down ms-auto" style="font-size:0.8em"></i></a>
                    <div class="collapse show" id="financeSubmenu">
                        <a href="salary.html" class="nav-link" style="padding-left: 3rem; font-size: 0.95em;"><i class="fas fa-money-bill-wave"></i> Salary</a>
                        <a href="expenses.html" class="nav-link" style="padding-left: 3rem; font-size: 0.95em;"><i class="fas fa-file-invoice-dollar"></i> Expenses</a>
                        <a href="incomes.html" class="nav-link" style="padding-left: 3rem; font-size: 0.95em;"><i class="fas fa-coins"></i> Income</a>
                    </div>
                    <a href="invoice.html" class="nav-link active"><i class="fas fa-file-invoice"></i> Invoices</a>
                    <a href="quotation.html" class="nav-link"><i class="fas fa-file-signature"></i> Quotations</a>
                    <a href="policy.html" class="nav-link"><i class="fas fa-book"></i> Company Policy</a>
                    <a href="#" class="nav-link" data-bs-toggle="modal" data-bs-target="#changePasswordModal"><i class="fas fa-key"></i> Change Password</a>
                    <a href="login.html" class="nav-link text-danger mt-4"><i class="fas fa-sign-out-alt"></i> Logout</a>
                `;
            } else if ((designation || '').toLowerCase() === 'hr') {
                menuHtml = `
                    <a href="hr-dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
                    <a href="hr-employees.html" class="nav-link"><i class="fas fa-users"></i> Employees</a>
                    <a href="hr-attendance.html" class="nav-link"><i class="fas fa-clock"></i> Attendance</a>
                    <a href="hr-salary.html" class="nav-link"><i class="fas fa-money-bill-wave"></i> Payroll</a>
                    <a href="invoice.html" class="nav-link active"><i class="fas fa-file-invoice"></i> Invoices</a>
                    <a href="quotation.html" class="nav-link"><i class="fas fa-file-signature"></i> Quotations</a>
                    <a href="policy.html" class="nav-link"><i class="fas fa-book"></i> Company Policy</a>
                    <a href="#" class="nav-link" data-bs-toggle="modal" data-bs-target="#changePasswordModal"><i class="fas fa-key"></i> Change Password</a>
                    <a href="login.html" class="nav-link text-danger mt-4"><i class="fas fa-sign-out-alt"></i> Logout</a>
                `;
            } else if ((designation || '').toLowerCase() === 'manager') {
                menuHtml = `
                    <a href="manager-dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
                    <a href="manager-attendance.html" class="nav-link"><i class="fas fa-clock"></i> My Attendance</a>
                    <a href="manager-daily-work.html" class="nav-link"><i class="fas fa-clipboard-list"></i> Daily Work Report</a>
                    <a href="manager-projects.html" class="nav-link"><i class="fas fa-project-diagram"></i> Assigned Projects</a>
                    <a href="invoice.html" class="nav-link active"><i class="fas fa-file-invoice"></i> Invoices</a>
                    <a href="quotation.html" class="nav-link"><i class="fas fa-file-signature"></i> Quotations</a>
                    <a href="policy.html" class="nav-link"><i class="fas fa-book"></i> Company Policy</a>
                    <a href="#" class="nav-link" data-bs-toggle="modal" data-bs-target="#changePasswordModal"><i class="fas fa-key"></i> Change Password</a>
                    <a href="login.html" class="nav-link text-danger mt-4"><i class="fas fa-sign-out-alt"></i> Logout</a>
                `;
            } else {
                menuHtml = `
                    <a href="employee-dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
                    <a href="daily-work.html" class="nav-link"><i class="fas fa-clipboard-list"></i> Daily Work Report</a>
                    <a href="invoice.html" class="nav-link active"><i class="fas fa-file-invoice"></i> Invoices</a>
                    <a href="quotation.html" class="nav-link"><i class="fas fa-file-signature"></i> Quotations</a>
                    <a href="policy.html" class="nav-link"><i class="fas fa-book"></i> Company Policy</a>
                    <a href="#" class="nav-link" data-bs-toggle="modal" data-bs-target="#changePasswordModal"><i class="fas fa-key"></i> Change Password</a>
                    <a href="login.html" class="nav-link text-danger mt-4"><i class="fas fa-sign-out-alt"></i> Logout</a>
                `;
            }
            
            sidebarMenu.innerHTML = menuHtml;
        });
    </script>
<datalist id="invoiceClientsList"></datalist>
</body>

</html>
